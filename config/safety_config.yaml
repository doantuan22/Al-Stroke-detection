camera:
  target_width: 1920
  target_height: 1080
  target_fps: 30
  buffer_size: 1

inference:
  pose_input_size: 768
  object_input_size: 960
  object_prefilter_confidence: 0.30
  pose_skip_default: 2
  pose_skip_max: 4
  object_skip_default: 2
  object_skip_max: 6
  adaptive_fps_low: 20
  adaptive_fps_high: 28
  db_sync_every_frames: 90

tracking:
  tracker_type: bytetrack
  tracker_config: bytetrack_stroke.yaml
  enable_reid: false
  max_history: 30
  grace_frames: 15

person:
  min_confidence: 0.55
  min_valid_keypoints: 6
  min_bbox_height_px: 48

alert:
  dedup_window_sec: 10
  evidence_frames_before: 5
  evidence_frames_after: 5
  max_stroke_uploads_per_track: 3
  stroke_upload_every_nth_alert: 1
  stroke_track_cooldown_sec: 5
  severity:
    observing: 0.4
    warning: 0.65
    critical: 0.85

stroke:
  cooldown_sec: 15
  suspected_duration_sec: 1.0
  confirmed_duration_sec: 5.0
  recovery_motion_ratio: 0.08
  recovery_streak_frames: 2
  recovery_gap_sec: 1.0
  kpts_conf_min: 0.25
  min_valid_kpts: 5
  sudden_vel_ratio: 0.07
  vel_window: 5
  aspect_ratio_min: 1.2
  bbox_h_max_ratio: 0.45
  head_hip_margin: 0.15
  sustained_posture: 30
  slump_aspect_min: 0.8
  slump_vel_ratio: 0.025
  slump_window: 12
  slump_sustained: 5
  smoothing:
    enabled: true
    method: ema
    alpha: 0.65

baggage:
  class_ids: [24, 26, 28]
  confidence_threshold: 0.45
  class_confidence_thresholds:
    backpack: 0.50
    handbag: 0.55
    suitcase: 0.48
  min_confirmed_seen_sec: 1.0
  min_confirmed_frames: 2
  min_box_width_px: 12
  min_box_height_px: 12
  min_aspect_ratio: 0.25
  max_aspect_ratio: 4.0
  owner_radius_px: 160
  proximity_expand_px: 150
  abandoned_timeout_sec: 60
  cooldown_sec: 120
  owner_presence_grace_sec: 2
  grace_period_sec: 3
  stationary_velocity_threshold: 2.0
  stationary_duration_sec: 3.0
  owner_leave_distance_threshold: 120
  risk_alert_threshold: 0.75
  risk:
    stationary_weight: 0.20
    owner_left_weight: 0.30
    no_nearby_person_weight: 0.20
    timeout_weight: 0.30
    leave_distance_weight: 0.15

weapon:
  model_path: models/weapon_yolo.pt
  fallback_to_coco: true
  confidence_threshold: 0.45
  min_pose_associated_confidence: 0.55
  min_unassociated_confidence: 0.70
  require_pose_association: false
  strict_pose_classes: [gun, pistol, rifle]
  class_confidence_thresholds:
    gun: 0.78
    pistol: 0.72
    rifle: 0.76
    knife: 0.75
    scissors: 0.75
  class_area_ratio_limits:
    gun: 0.18
    pistol: 0.15
    rifle: 0.22
    knife: 1.50
    scissors: 1.00
  min_persistence_sec: 5.0
  bearer_radius_px: 200
  wrist_distance_threshold: 100
  pose_confidence_boost: 0.15
  cooldown_sec: 5
  overlay_persist_sec: 2
  coco_class_ids: [43]

zones:
  default:
    baggage_timeout_sec: 60
    weapon_severity_boost: high
  security_checkpoint:
    baggage_timeout_sec: 20
    weapon_severity_boost: critical
  waiting_area:
    baggage_timeout_sec: 60
    weapon_severity_boost: high
